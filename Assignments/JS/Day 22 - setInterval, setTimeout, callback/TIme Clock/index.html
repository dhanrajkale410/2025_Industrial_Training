<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Time Clock</title>
</head>
<body onload="startTime()">
    <section>
        <div class="container">
            <div class="box">
                <h3 id="hours"></h3>
            </div>
            <h2>:</h2>
            <div class="box">
                <h3 id="minutes"></h3>
            </div>
            <h2>:</h2>
            <div class="box">
                <h3 id="seconds"></h3>
            </div>
        </div>
    </section>
    <script src="script.js" defer></script>
</body>
</html>
